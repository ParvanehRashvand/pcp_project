[project]
name = "pcp-project"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "scipy-stubs~=1.17.1",
]
[tool.setuptools.packages.find]
where = ["."]
include = ["pcp_project*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
